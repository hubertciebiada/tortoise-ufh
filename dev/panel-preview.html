<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tortoise-UFH panel — preview harness</title>
    <!--
      Standalone visual-QA harness for the Tortoise-UFH sidebar panel.

      This file is NOT shipped and NOT registered by the integration. It exists
      only so the panel can be eyeballed in a plain browser without a running
      Home Assistant: it mocks the `hass` object the panel consumes (callWS with
      sample get_config / get_live, a states map, themes.darkMode, language),
      stubs <ha-icon>, imports the real panel module relatively, mounts the
      custom element and assigns hass.

      Open directly in a browser (file://) or serve the repo root. Use the
      controls at the top to flip theme, language, scenario and room count
      (3 | 11 — the latter adds eight generated rooms so the panel can be
      checked at the owner's scale), and to simulate the 5-second poll
      advancing the "last cycle" age.
    -->
    <style>
      :root {
        /* A minimal stand-in for HA's light theme tokens the panel reads. */
        --primary-text-color: #212121;
        --secondary-text-color: #727272;
        --disabled-text-color: #bdbdbd;
        --primary-background-color: #f4f5f7;
        --card-background-color: #ffffff;
        --divider-color: rgba(0, 0, 0, 0.12);
        --primary-color: #03a9f4;
        --text-primary-color: #ffffff;
        --accent-color: #ff9800;
        --error-color: #db4437;
        --warning-color: #ffa600;
        --success-color: #43a047;
        --info-color: #039be5;
        --secondary-background-color: #e6e8eb;
        --state-icon-color: #44739e;
        --ha-card-border-radius: 12px;
        font-family: Roboto, system-ui, -apple-system, sans-serif;
      }
      :root[data-theme="dark"] {
        /* HA's dark theme token values. */
        --primary-text-color: #e1e1e1;
        --secondary-text-color: #9b9b9b;
        --disabled-text-color: #6f6f6f;
        --primary-background-color: #111111;
        --card-background-color: #1c1c1c;
        --divider-color: rgba(225, 225, 225, 0.12);
        --primary-color: #2196f3;
        --text-primary-color: #ffffff;
        --accent-color: #ff9800;
        --error-color: #ef5350;
        --warning-color: #ffa600;
        --success-color: #66bb6a;
        --info-color: #4fc3f7;
        --secondary-background-color: #282828;
        --state-icon-color: #7a9bbd;
      }
      body {
        margin: 0;
        background: var(--primary-background-color);
        color: var(--primary-text-color);
      }
      #toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        padding: 10px 16px;
        background: var(--card-background-color);
        border-bottom: 1px solid var(--divider-color);
        font-size: 13px;
        position: sticky;
        top: 0;
        /* Below the panel's overlay drawer + scrim (z-index 6/7), so the
           narrow-viewport room inspector can be exercised in the preview. */
        z-index: 5;
      }
      #toolbar strong { margin-right: 6px; }
      #toolbar button {
        font: inherit;
        padding: 5px 10px;
        border-radius: 8px;
        border: 1px solid var(--divider-color);
        background: var(--primary-background-color);
        color: var(--primary-text-color);
        cursor: pointer;
      }
      #toolbar button.active {
        background: var(--primary-color);
        color: var(--text-primary-color);
        border-color: var(--primary-color);
      }
      #toolbar .sep { width: 1px; align-self: stretch; background: var(--divider-color); }
      #log {
        font-family: ui-monospace, monospace;
        font-size: 11px;
        color: var(--secondary-text-color);
        margin-left: auto;
      }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <strong>Motyw</strong>
      <button data-theme-btn="light" class="active">Light</button>
      <button data-theme-btn="dark">Dark</button>
      <span class="sep"></span>
      <strong>Język</strong>
      <button data-lang-btn="pl" class="active">PL</button>
      <button data-lang-btn="en">EN</button>
      <button data-lang-btn="de">DE</button>
      <span class="sep"></span>
      <strong>Scenariusz</strong>
      <button data-scenario-btn="heating" class="active">Grzanie</button>
      <button data-scenario-btn="cooling">Chłodzenie</button>
      <button data-scenario-btn="stale">Stale</button>
      <span class="sep"></span>
      <strong>Pokoje</strong>
      <button data-rooms-btn="3" class="active">3</button>
      <button data-rooms-btn="11">11</button>
      <span class="sep"></span>
      <!-- Per-room control is the two-state segment in the room table's first
           column (Off / Live) — click it to exercise set_room_state. -->
      <span class="hint" style="color: var(--secondary-text-color)"
        >Sterowanie pokoju → segment 2-stanu w tabeli</span
      >
      <span class="sep"></span>
      <button id="poll-btn">Symuluj poll (+70 s)</button>
      <span id="log"></span>
    </div>

    <tortoise-ufh-panel id="panel"></tortoise-ufh-panel>

    <script>
      // --- Stub <ha-icon> so the panel's feature-detection succeeds ---------
      if (!customElements.get("ha-icon")) {
        class HaIconStub extends HTMLElement {
          static get observedAttributes() {
            return ["icon"];
          }
          connectedCallback() {
            this._render();
          }
          attributeChangedCallback() {
            this._render();
          }
          _render() {
            // Render a tiny glyph derived from the mdi name so icons are visible.
            const icon = this.getAttribute("icon") || "";
            const map = {
              "mdi:tortoise": "🐢",
              "mdi:cog-outline": "⚙",
              "mdi:close": "✕",
              "mdi:open-in-new": "↗",
              "mdi:power": "⏻",
              "mdi:play": "▶",
              "mdi:information-outline": "ⓘ",
            };
            this.textContent = map[icon] || "•";
            this.style.display = "inline-flex";
            this.style.width = "var(--mdc-icon-size, 24px)";
            this.style.height = "var(--mdc-icon-size, 24px)";
            this.style.alignItems = "center";
            this.style.justifyContent = "center";
            this.style.fontSize = "calc(var(--mdc-icon-size, 24px) * 0.85)";
          }
        }
        customElements.define("ha-icon", HaIconStub);
      }

      // --- Mock entity states (read by the wiring section) ------------------
      const STATES = {
        "sensor.salon_temp": { state: "21.4", attributes: { unit_of_measurement: "°C" } },
        "sensor.salon_rh": { state: "46", attributes: { unit_of_measurement: "%" } },
        "sensor.outdoor_temp": { state: "3.2", attributes: { unit_of_measurement: "°C" } },
        "number.salon_valve_1": { state: "62", attributes: { unit_of_measurement: "%" } },
        "number.salon_valve_2": { state: "62", attributes: { unit_of_measurement: "%" } },
        "sensor.salon_supply_1": { state: "34.1", attributes: { unit_of_measurement: "°C" } },
        "sensor.salon_return_1": { state: "28.7", attributes: { unit_of_measurement: "°C" } },
        "sensor.salon_supply_2": { state: "33.8", attributes: { unit_of_measurement: "°C" } },
        "sensor.salon_return_2": { state: "28.4", attributes: { unit_of_measurement: "°C" } },
        "climate.salon_split": { state: "heat", attributes: {} },
        "sensor.kuchnia_temp": { state: "unavailable", attributes: {} },
        "sensor.kuchnia_rh": { state: "51", attributes: { unit_of_measurement: "%" } },
        "number.kuchnia_valve": { state: "0", attributes: { unit_of_measurement: "%" } },
        "sensor.lazienka_temp": { state: "23.9", attributes: { unit_of_measurement: "°C" } },
        "sensor.lazienka_rh": { state: "68", attributes: { unit_of_measurement: "%" } },
        "number.lazienka_valve": { state: "18", attributes: { unit_of_measurement: "%" } },
        "sensor.lazienka_supply": { state: "17.2", attributes: { unit_of_measurement: "°C" } },
        "climate.lazienka_split": { state: "off", attributes: {} },
        // Diagnostic (future field) — the integration's own output sensors.
        "sensor.tortoise_salon_recommended_valve": {
          state: "62",
          attributes: { unit_of_measurement: "%" },
        },
      };

      // --- Generated rooms for the "Pokoje: 11" scale check ------------------
      // Eight rooms appended to the three hand-written ones when
      // `state.roomCount >= 11`, so the panel can be checked at the owner's
      // real scale. ONE table drives everything a room needs: its get_config
      // entry, its get_live report per scenario, its hass.states entries
      // (rebuilt on every push / poll, see syncExtraStates) and its manifold
      // circuits.
      //   area / offset / cooling / split / loops   config (loops = valves)
      //   state     default control state; "off" gives the passive Mode.OFF
      //             result (valve 0, split off, no flags)
      //   upstairs  the loops sit on the "Piętro" manifold (eight rooms need
      //             >= 8 circuits, so the ground-floor rooms stay unplaced)
      //   stuck     loop whose actuator feedback stays at 0 % while the room is
      //             live (pairs with the valve_mismatch flag); parked = where
      //             the valves physically stand while the room is off
      //   rhLost    humidity entity unavailable (pairs with rh_stale_gated)
      //   h / c     heating / cooling view: err = setpoint - measured [K]
      //             (heating: + cold; cooling: - warm), valve = commanded [%]
      //             (raw = unclamped PI demand, thr = S2 throttle factor),
      //             trend [K/h], dew = room dew point [degC] (<= 17.4, so the
      //             global safe dew point of 19.4 stays the maximum), fast =
      //             split mode while engaged (manual = adopted from the remote:
      //             mirrored, no target), dwell = min-ON dwell left [s]
      const BASE_ROOMS = ["Salon", "Kuchnia", "Łazienka"];
      const EXTRA_ROOMS = [
        {
          name: "Sypialnia", slug: "sypialnia", area: 15.5, offset: -0.5,
          cooling: true, split: true, loops: 1, state: "live", upstairs: true,
          rhLost: true,
          h: { err: 0.2, valve: 38, trend: 0.04, dew: 8.4, flags: ["rh_stale_gated"] },
          c: { err: -0.2, valve: 30, trend: 0.03, dew: 13.4, flags: ["rh_stale_gated"] },
        },
        {
          name: "Gabinet", slug: "gabinet", area: 12.0, offset: 0,
          cooling: true, split: true, loops: 1, state: "live", upstairs: true,
          h: {
            err: 0.1, valve: 41, trend: 0.02, dew: 8.6,
            fast: "heating", manual: true, flags: ["fast_source_manual"],
          },
          c: {
            err: -0.1, valve: 24, trend: 0.02, dew: 13.1,
            fast: "cooling", manual: true, flags: ["fast_source_manual"],
          },
        },
        {
          name: "Garderoba", slug: "garderoba", area: 6.0, offset: 0,
          cooling: true, split: false, loops: 1, state: "off", upstairs: true,
          parked: 30,
          h: { err: -0.1, valve: 20, trend: 0.0, dew: 8.8 },
          c: { err: 0.1, valve: 12, trend: 0.0, dew: 12.8 },
        },
        {
          name: "Hol", slug: "hol", area: 9.5, offset: 0,
          cooling: true, split: false, loops: 2, state: "live", upstairs: true,
          stuck: 0,
          h: { err: 0.0, valve: 33, trend: 0.0, dew: 9.0, flags: ["valve_mismatch"] },
          c: { err: 0.0, valve: 20, trend: 0.0, dew: 13.6, flags: ["valve_mismatch"] },
        },
        {
          name: "Jadalnia", slug: "jadalnia", area: 24.0, offset: 0,
          cooling: true, split: false, loops: 3, state: "live", upstairs: false,
          h: { err: 0.8, valve: 78, trend: 0.18, dew: 9.3 },
          c: { err: -0.8, valve: 62, trend: 0.12, dew: 14.6 },
        },
        {
          name: "Pokój gościnny", slug: "goscinny", area: 14.0, offset: 0,
          cooling: true, split: true, loops: 1, state: "live", upstairs: true,
          h: { err: -0.9, valve: 0, raw: -3, trend: -0.12, dew: 9.9 },
          c: { err: 0.9, valve: 0, raw: -3, trend: -0.1, dew: 12.9 },
        },
        {
          name: "Pralnia", slug: "pralnia", area: 7.5, offset: 0,
          cooling: false, split: false, loops: 1, state: "live", upstairs: false,
          h: { err: 0.3, valve: 55, trend: 0.08, dew: 10.6 },
          c: { err: -0.3, valve: 0, trend: 0.04, dew: 14.2, flags: ["cooling_disabled"] },
        },
        {
          name: "Pokój dziecięcy", slug: "dzieciecy", area: 13.0, offset: 0.5,
          cooling: true, split: true, loops: 1, state: "live", upstairs: true,
          h: {
            err: 1.6, valve: 100, raw: 112, trend: 0.1, dew: 9.2,
            fast: "heating", dwell: 360,
          },
          c: {
            err: -1.6, valve: 25, raw: 62, thr: 0.4, trend: 0.18, dew: 17.2,
            fast: "dry", dwell: 180, flags: ["s2_throttle"],
          },
        },
      ];

      /** Names of the rooms currently shown (3 hand-written, or all 11). */
      function activeRoomNames() {
        return state.roomCount >= 11
          ? BASE_ROOMS.concat(EXTRA_ROOMS.map((r) => r.name))
          : BASE_ROOMS;
      }

      /**
       * Entity ids of one generated room. The valve / supply / return lists are
       * parallel (one entry per loop) and follow the hand-written rooms'
       * naming, which is also what sampleManifolds' loop() helper derives the
       * probe ids from (valve -> supply / return, number. -> sensor.).
       */
      function extraIds(r) {
        const list = (domain, key) =>
          Array.from(
            { length: r.loops },
            (_, k) =>
              domain + "." + r.slug + "_" + key + (r.loops > 1 ? "_" + (k + 1) : ""),
          );
        return {
          temp: "sensor." + r.slug + "_temp",
          rh: "sensor." + r.slug + "_rh",
          valves: list("number", "valve"),
          supply: list("sensor", "supply"),
          return: list("sensor", "return"),
          split: r.split ? "climate." + r.slug + "_split" : null,
        };
      }

      /** One generated room's get_config entry. */
      function extraConfigRoom(r) {
        const id = extraIds(r);
        // The registered diagnostic sensors (websocket._DIAGNOSTIC_SENSOR_KEYS).
        const diagnostic = {};
        for (const key of [
          "recommended_valve",
          "error_c",
          "trend_c_per_h",
          "room_dew_point",
          "i_term",
          "trend_term",
          "fast_source_mode",
        ]) {
          diagnostic[key] = "sensor.tortoise_" + r.slug + "_" + key;
        }
        return {
          name: r.name,
          area_m2: r.area,
          offset_c: r.offset,
          cooling_enabled: r.cooling,
          control_state: state.roomStates[r.name],
          fast_source_kind: r.split ? "split" : "none",
          fast_source_group: "",
          fast_source_window_start: null,
          fast_source_window_end: null,
          entities: {
            entity_temp_room: id.temp,
            entity_humidity: id.rh,
            entity_temp_outdoor: "sensor.outdoor_temp",
            entity_valves: id.valves,
            entity_supply: id.supply,
            entity_return: id.return,
            entity_fast_source: id.split,
          },
          diagnostic_entities: diagnostic,
        };
      }

      /**
       * One generated room's numbers for a scenario, honouring its control
       * state (state.roomStates) and the home setpoint. An "off" room (core
       * Mode.OFF) and a cooling-disabled room in cooling mode both give the
       * passive result: valve 0, split off, PI idle.
       */
      function extraView(r, scenario) {
        const cooling = scenario === "cooling";
        const v = cooling ? r.c : r.h;
        const live = state.roomStates[r.name] === "live";
        const passive = !live || (cooling && !r.cooling);
        const setpoint = +(state.homeSetpoint + r.offset).toFixed(2);
        const valve = passive ? 0 : v.valve;
        const raw = passive ? 0 : (v.raw ?? v.valve);
        // PI split as the core reports it: error in the "needs more actuation"
        // sign, dead-banded (0.3 K, kp 14); trend damping only while the room
        // moves toward the setpoint (kt 12); the integrator is the remainder.
        const dir = cooling ? -1 : 1;
        const e = dir * v.err;
        const p = passive
          ? 0
          : +(14 * Math.sign(e) * Math.max(0, Math.abs(e) - 0.3)).toFixed(1);
        const trendTerm = passive ? 0 : +(-12 * Math.max(0, dir * v.trend)).toFixed(1);
        const iTerm = passive ? 0 : +(raw - p - trendTerm).toFixed(1);
        const fast = !passive && r.split && v.fast ? v.fast : "off";
        const target =
          fast === "off" || v.manual
            ? null
            : +(setpoint + { heating: 1, cooling: -1, dry: 0 }[fast]).toFixed(1);
        const band =
          Math.abs(v.err) <= 0.3
            ? "W paśmie nastawy"
            : v.err > 0
              ? "Poniżej zadanej o " + v.err.toFixed(1) + " K"
              : "Powyżej zadanej o " + (-v.err).toFixed(1) + " K";
        const splitText =
          fast === "off"
            ? ""
            : v.manual
              ? ", split sterowany ręcznie"
              : fast === "dry"
                ? ", split osusza"
                : ", split wspomaga do " + target + "°C";
        return {
          cooling,
          live,
          passive,
          setpoint,
          err: v.err,
          temp: +(setpoint - v.err).toFixed(2),
          trend: v.trend,
          dew: v.dew,
          valve,
          raw,
          throttle: passive ? 1.0 : (v.thr ?? 1.0),
          p,
          trendTerm,
          iTerm,
          fast,
          target,
          dwell: fast !== "off" && !v.manual ? (v.dwell ?? null) : null,
          flags: live ? v.flags || [] : [],
          // Mirrors classify_dew_eligibility: Mode.OFF reads as not cooling.
          dewReason: !cooling || !live ? "not_cooling_mode" : r.cooling ? null : "cooling_disabled",
          explanation: !live
            ? "Off (" + r.name + "): zawor 0%, brak komend."
            : passive
              ? "Chlodzenie wykluczone (" + r.name + "): zawor 0%, split OFF."
              : band + " — zawór " + valve + "%" + splitText + ".",
          // Actuator feedback per loop: a live room follows its command except
          // the stuck loop; an off room's valves stay where they were parked.
          feedback: Array.from({ length: r.loops }, (_, k) =>
            live ? (r.stuck === k ? 0 : valve) : (r.parked ?? 0),
          ),
        };
      }

      /** One generated room's get_live entry. */
      function extraLive(r, scenario) {
        const x = extraView(r, scenario);
        return liveRoom({
          valve_position_pct: x.valve,
          setpoint_c: x.setpoint,
          fast_source:
            x.fast === "off"
              ? undefined
              : { on: true, mode: x.fast, target_temperature_c: x.target },
          report: {
            error_c: x.err,
            trend_c_per_h: x.trend,
            room_dew_point_c: x.dew,
            room_temperature_c: x.temp,
            p_term: x.p,
            i_term: x.iTerm,
            trend_term: x.trendTerm,
            feedforward_term: 0.0,
            raw_valve_pct: x.raw,
            saturated: x.raw > 100,
            dew_throttle_factor: x.throttle,
            integrator_frozen: x.passive,
            dew_excluded_reason: x.dewReason,
            fast_dwell_remaining_s: x.dwell,
            flags: x.flags,
            explanation: x.explanation,
          },
        });
      }

      /**
       * Loop water temperatures [degC]: the supply sits a little below the
       * manifold main, the return one loop-dT below it (above it when cooling).
       * A closed valve carries no flow, so its supply and return agree.
       */
      function extraLoopTemps(roomIdx, loopIdx, open, cooling) {
        const main = cooling ? 17.2 : 34.6;
        const supply = main - 0.3 - 0.1 * ((roomIdx + loopIdx) % 4);
        const dt = open ? 3.0 + 0.7 * ((roomIdx * 3 + loopIdx * 2) % 4) : 0.2;
        return [supply, cooling ? supply + dt : supply - dt];
      }

      /** Relative humidity [%] consistent with a temperature and dew point (Magnus). */
      function rhFromDew(tempC, dewC) {
        const a = 17.62;
        const b = 243.12;
        return 100 * Math.exp((a * dewC) / (b + dewC) - (a * tempC) / (b + tempC));
      }

      /**
       * (Re)write the generated rooms' entries in STATES so hass.states agrees
       * with the live payload: temperature, humidity, valve feedback, loop
       * supply / return and the split's climate entity. Inert while the rooms
       * are hidden; re-run on every push and live poll so a scenario flip, a
       * room-state toggle or a new home setpoint is reflected.
       */
      function syncExtraStates(scenario) {
        const reading = (value, unit) => ({
          state: String(value),
          attributes: { unit_of_measurement: unit },
        });
        const cooling = scenario === "cooling";
        // Physical climate state + hvac_action per commanded split mode.
        const climate = {
          off: ["off", "off"],
          heating: ["heat", "heating"],
          cooling: ["cool", "cooling"],
          dry: ["dry", "drying"],
        };
        EXTRA_ROOMS.forEach((r, roomIdx) => {
          const x = extraView(r, scenario);
          const id = extraIds(r);
          STATES[id.temp] = reading(x.temp.toFixed(1), "°C");
          STATES[id.rh] = r.rhLost
            ? { state: "unavailable", attributes: {} }
            : reading(Math.round(rhFromDew(x.temp, x.dew)), "%");
          id.valves.forEach((valveId, k) => {
            STATES[valveId] = reading(x.feedback[k], "%");
            const [supply, ret] = extraLoopTemps(roomIdx, k, x.feedback[k] >= 5, cooling);
            STATES[id.supply[k]] = reading(supply.toFixed(1), "°C");
            STATES[id.return[k]] = reading(ret.toFixed(1), "°C");
          });
          if (id.split) {
            const [physical, action] = climate[x.fast];
            STATES[id.split] = { state: physical, attributes: { hvac_action: action } };
          }
        });
      }

      // --- Sample get_config (matches ConfigResult.to_dict) -----------------
      function sampleConfig(scenario) {
        const mode = scenario === "cooling" ? "cooling" : "heating";
        const config = {
          home_setpoint_c: state.homeSetpoint,
          mode,
          global_safe_dew_point_entity_id: "sensor.tortoise_global_safe_dew_point",
          // B2 (v0.8.0): the configured heat-pump-link entity ids (null when
          // the section is unconfigured) — generic HeishaMon-style examples.
          heat_pump: {
            entity_hp_mode: "select.heat_pump_mode",
            entity_hp_cooling_setpoint: "number.z1_cool_request_temp",
          },
          rooms: [
            {
              name: "Salon",
              area_m2: 32.5,
              offset_c: 0.5,
              cooling_enabled: true,
              control_state: state.roomStates["Salon"],
              fast_source_kind: "split",
              // K9 (v0.6.1): the multisplit group key flows in get_config.
              fast_source_group: "outdoor_unit_a",
              // B1 (v0.8.0): no quiet-hours window for the Salon (always).
              fast_source_window_start: null,
              fast_source_window_end: null,
              entities: {
                entity_temp_room: "sensor.salon_temp",
                entity_humidity: "sensor.salon_rh",
                entity_temp_outdoor: "sensor.outdoor_temp",
                entity_valves: ["number.salon_valve_1", "number.salon_valve_2"],

      // --- Sample get_live (matches LiveResult.to_dict) ---------------------
      function liveRoom(over) {
        const report = Object.assign(
          {
            error_c: 0.0,
            trend_c_per_h: 0.0,
            room_dew_point_c: 9.5,
            p_term: 0.0,
            i_term: 0.0,

            raw_valve_pct: 0.0,
            valve_floor_applied: false,
            saturated: false,
            dew_throttle_factor: 1.0,
            integrator_frozen: false,
            // Additive report fields — always present in the real WS payload
            // (RoomReport.to_dict): the echoed measured temperature (the
            // panel renders THIS, never a setpoint-error reconstruction),
            // why the room is excluded from the global safe dew point, and
            // the fast-source min ON/OFF dwell remaining.
            room_temperature_c: null,
            dew_excluded_reason: null,
            fast_dwell_remaining_s: null,
            flags: [],
            explanation: "",
          },
          over.report || {},
        );
        return {
          valve_position_pct: over.valve_position_pct ?? 0,
          fast_source: over.fast_source || {
            on: false,
            mode: "off",

          report,
          setpoint_c: over.setpoint_c ?? 21.5,

      }

      function sampleLive(scenario, ageSeconds) {

              // safe dew point; eligible (null) once the mode is cooling.

              integrator_frozen: true,

              // temperature reading while cooling; "not_cooling_mode" otherwise.

      // --- Sample manifolds (match ManifoldView.to_dict; v0.21.0) ------------
      // Two distributors over the three sample rooms: "Wschód" (5 circuits,
      // main connection on the left, both main probes) carries the two Salon
      // loops, the Kuchnia loop and a free circuit; "Zachód" (3 circuits,
      // main connection on the right, no main probes) carries the Łazienka
      // loop and two free circuits. The cooling scenario flips the ΔT sign
      // and flags the Łazienka circuit (S6 no-flow).
      function sampleManifolds(scenario) {
        const cooling = scenario === "cooling";
        const sup = cooling ? 17.2 : 34.6;
        // `pct` is the actuator feedback; `commandPct` (default: the same) the
        // commanded position — they differ for a stuck or switched-off valve.
        const loop = (
          position, room, index, label, valveId, pct, ts, tr, flags, commandPct,
        ) => ({
          position,
          room_name: room,
          loop_index: index,
          loop_label: label,
          valve: { pct, command_pct: commandPct ?? pct, entity_id: valveId },
          supply: { value: ts, entity_id: valveId ? valveId.replace("valve", "supply").replace("number.", "sensor.") : null },
          return: { value: tr, entity_id: valveId ? valveId.replace("valve", "return").replace("number.", "sensor.") : null },
          delta_k: ts !== null && tr !== null ? ts - tr : null,
          flags: flags || [],
        });
        const free = (position) => ({
          position,
          room_name: null,
          loop_index: null,
          loop_label: null,
          valve: { pct: null, command_pct: null, entity_id: null },
          supply: { value: null, entity_id: null },
          return: { value: null, entity_id: null },
          delta_k: null,
          flags: [],
        });
        const d = (k) => (cooling ? -k : k);
        const manifolds = [
          {
            id: "wschod",
            name: "Wschód",
            circuits: 5,
            side: "left",
            main: {
              supply: { value: sup, entity_id: "sensor.wschod_z0" },
              return: { value: sup - d(4.1), entity_id: "sensor.wschod_p0" },
            },
            positions: [
              loop(1, "Salon", 0, "Salon 1", "number.salon_valve_1", 62, sup - 0.3, sup - 0.3 - d(5.2)),
              loop(2, "Salon", 1, "Salon 2", "number.salon_valve_2", 62, sup - 0.4, sup - 0.4 - d(4.8)),
              free(3),
              loop(4, "Kuchnia", 0, "Kuchnia", "number.kuchnia_valve", 0, null, null),
              free(5),
            ],
          },
          {
            id: "zachod",
            name: "Zachód",
            circuits: 3,
            side: "right",
            main: {
              supply: { value: null, entity_id: null },
              return: { value: null, entity_id: null },
            },
            positions: [
              loop(
                1,
                "Łazienka",
                0,
                "Łazienka",
                "number.lazienka_valve",
                cooling ? 12 : 100,
                sup - 0.6,
                cooling ? sup - 0.6 : sup - 0.6 - 0.2,
                cooling ? [] : ["loop_no_flow"],
              ),
              free(2),
              free(3),
            ],
          },
        ];
        // "Pokoje: 11" — a third distributor, "Piętro" (8 circuits, main on the
        // left, both main probes): the upstairs rooms' loops in table order
        // (7 of them), circuit 8 left free. Jadalnia and Pralnia (4 loops) sit
        // on no mock manifold — a valve wired to no circuit simply isn't drawn.
        if (state.roomCount >= 11) {
          // Room flags that belong on every circuit of the room (manifold.py).
          const loopFlags = ["s1_floor_overheat", "s2_condensation", "valve_mismatch"];
          const positions = [];
          EXTRA_ROOMS.forEach((r, roomIdx) => {
            if (!r.upstairs) {
              return;
            }
            const x = extraView(r, scenario);
            extraIds(r).valves.forEach((valveId, k) => {
              const feedback = x.feedback[k];
              const [ts, tr] = extraLoopTemps(roomIdx, k, feedback >= 5, cooling);
              positions.push(
                loop(
                  positions.length + 1,
                  r.name,
                  k,
                  r.loops > 1 ? r.name + " " + (k + 1) : r.name,
                  valveId,
                  feedback,
                  ts,
                  tr,
                  x.flags.filter((f) => loopFlags.includes(f)),
                  x.valve,
                ),
              );
            });
          });
          while (positions.length < 8) {
            positions.push(free(positions.length + 1));
          }
          manifolds.push({
            id: "pietro",
            name: "Piętro",
            circuits: 8,
            side: "left",
            main: {
              supply: { value: sup, entity_id: "sensor.pietro_z0" },
              return: { value: sup - d(4.4), entity_id: "sensor.pietro_p0" },
            },
            positions,
          });
        }
        return manifolds;
      }

      // --- Sample heat-pump payload (matches HeatPumpRuntime.to_dict) -------
      function sampleHeatPump(scenario) {
        const cooling = scenario === "cooling";
        const current = state.hpDhw ? "Heat+DHW" : "Heat only";
        const desired = cooling
          ? state.hpDhw
            ? "Cool+DHW"
            : "Cool only"
          : current;
        return {
          configured: true,
          mode_entity_id: "select.heat_pump_mode",
          current_option: current,
          desired_option: desired,
          in_sync: !cooling, // the mock pump lags a cooling switch (divergence)
          dhw_active: state.hpDhw,
          dhw_only: false,
          cooling: {
            entity_id: "number.z1_cool_request_temp",
            target_c: cooling ? 19.4 : null,
            base_c: 18.0,
            safe_dew_c: cooling ? 19.4 : null,
          },
          heating: null, // heating setpoint entity not configured (default)
          hp_active: null,
          hp_active_configured: false,
          // Only the rooms shown count (the generated ones are seeded "live"
          // even while hidden).
          writes_enabled: activeRoomNames().some((n) => state.roomStates[n] === "live"),
        };
      }

      // --- Mock recorder history / statistics -------------------------------
      // Synthesizes a plausible waveform per entity id so the charts render.
      // Timestamps mirror HA: history `lu` in epoch SECONDS, statistics
      // `start`/`end` in epoch MILLISECONDS.
      function waveValue(id, tMs) {
        const hours = tMs / 3600000;
        const k = id.toLowerCase();
        if (k.includes("valve") || k.includes("recommended")) {
          // Per-entity phase from the id hash, so the Overview's aggregated
          // valve mean is not one room's wave.
          const phase = 2 * Math.PI * ((hashId(k) & 0xff) / 255);
          return Math.max(0, Math.min(100, Math.round(50 + 42 * Math.sin(hours / 3 + phase))));
        }
        if (k.includes("error")) {
          // Per-entity amplitude 0.4..1.2 K, phase and period divisor 2..4 h
          // from the id hash, so every room's sparkline differs (|v| <= 1.2).
          const h = hashId(k);
          const amp = 0.4 + 0.8 * ((h & 0xff) / 255);
          const phase = 2 * Math.PI * (((h >>> 8) & 0xff) / 255);
          const period = 2 + 2 * (((h >>> 16) & 0xff) / 255);
          return +(amp * Math.sin(hours / period + phase)).toFixed(2);
        }
        if (k.includes("dew")) {
          return +(12 + 3 * Math.sin(hours / 4)).toFixed(1);
        }
        if (k.includes("trend")) {
          return +(0.3 * Math.cos(hours / 2)).toFixed(2);
        }
        if (k.includes("outdoor")) {
          return +(4 + 5 * Math.sin(hours / 6)).toFixed(1);
        }
        let base = 21.5;
        if (k.includes("lazienka")) base = 22.8;
        return +(base + 1.1 * Math.sin(hours / 2.5) + 0.3 * Math.sin(hours)).toFixed(2);
      }

      // Small deterministic string hash (FNV-1a, unsigned 32-bit).
      function hashId(id) {
        let h = 2166136261;
        for (let i = 0; i < id.length; i++) {
          h = Math.imul(h ^ id.charCodeAt(i), 16777619) >>> 0;
        }
        return h;
      }

      function mockHistory(entityIds, startMs, endMs) {
        const out = {};
        const stepMs = 10 * 60 * 1000;
        for (const id of entityIds || []) {
          const arr = [];
          const gappy = id.includes("kuchnia"); // lost-sensor room → show a gap
          for (let t = startMs; t <= endMs; t += stepMs) {
            const frac = (t - startMs) / (endMs - startMs || 1);
            const s = gappy && frac > 0.7 && frac < 0.85 ? "unavailable" : String(waveValue(id, t));
            arr.push({ s, lu: t / 1000 }); // lu = epoch SECONDS
          }
          out[id] = arr;
        }
        return out;
      }

      // `period` is HA's bucket size: "5minute" / "hour" (the default, also for
      // an unknown value) are epoch-aligned, "day" starts at LOCAL midnight like
      // HA's daily statistics. Rows keep `start` / `end` in epoch MILLISECONDS.
      function mockStatistics(ids, startMs, endMs, period) {
        const buckets = [];
        if (period === "day") {
          const day = new Date(startMs);
          day.setHours(0, 0, 0, 0);
          if (day.getTime() < startMs) {
            day.setDate(day.getDate() + 1);
          }
          while (day.getTime() <= endMs) {
            const start = day.getTime();
            day.setDate(day.getDate() + 1);
            buckets.push([start, day.getTime()]);
          }
        } else {
          const stepMs = period === "5minute" ? 5 * 60 * 1000 : 3600 * 1000;
          for (let t = Math.ceil(startMs / stepMs) * stepMs; t <= endMs; t += stepMs) {
            buckets.push([t, t + stepMs]);
          }
        }
        const out = {};
        for (const id of ids || []) {
          out[id] = buckets.map(([start, end]) => ({
            start,
            end,
            mean: waveValue(id, start), // ms timestamps, as HA
          }));
        }
        return out;
      }

      // --- Mock hass --------------------------------------------------------
      // `roomStates` is the canonical two-state control map the coordinator
      // owns; both get_config and get_live read from it, and set_room_state
      // mutates it so the optimistic UI reconciles on the follow-up poll.
      const state = {
        theme: "light",
        lang: "pl",
        scenario: "heating",
        ageSeconds: 45,
        roomStates: Object.assign(
          { Salon: "live", Kuchnia: "off", "Łazienka": "live" },
          // The generated rooms (shown only with roomCount >= 11) — always seeded.
          Object.fromEntries(EXTRA_ROOMS.map((r) => [r.name, r.state])),
        ),
        // Rooms shown: 3 (the hand-written ones) or 11 (+ EXTRA_ROOMS).
        roomCount: 3,
        // Global home setpoint (read by get_config + get_live, written by
        // set_home_temperature).
        homeSetpoint: 21.0,
        // Sparse per-room controller overrides (mirrors CONF_ROOM_TUNING).
        tuningRooms: { Salon: { kt: 8.0 } },
        // B2 (v0.8.0): the pump's +DHW flag (toggled by set_hp_dhw).
        hpDhw: true,
      };
      const logEl = document.getElementById("log");

      // --- Sample get_tuning (matches TuningResult.to_dict) -----------------
      // Ranges mirror const.CONTROLLER_NUMBER_KNOBS + the boolean knob
      // (v0.6.1: dwell floors 3 min, dew margin floor 0.5 K, ff knobs).
      const TUNE_FIELDS = [
        { name: "kp", type: "number", min: 0, max: 50, step: 0.1, unit: "%/K" },
        { name: "ki", type: "number", min: 0, max: 1, step: 0.001, unit: "%/(K·s)" },
        { name: "kt", type: "number", min: 0, max: 50, step: 0.1, unit: "%/(K/h)" },
        { name: "deadband_c", type: "number", min: 0, max: 5, step: 0.1, unit: "K" },
        { name: "valve_floor_pct", type: "number", min: 0, max: 100, step: 1, unit: "%" },
        { name: "boost_offset_c", type: "number", min: 0, max: 10, step: 0.1, unit: "K" },
        { name: "fast_min_on_minutes", type: "number", min: 3, max: 60, step: 1, unit: "min" },
        { name: "fast_min_off_minutes", type: "number", min: 3, max: 60, step: 1, unit: "min" },
        { name: "fast_target_offset_k", type: "number", min: 0, max: 3, step: 0.5, unit: "K" },
        { name: "dew_margin_k", type: "number", min: 0.5, max: 10, step: 0.1, unit: "K" },
        { name: "dew_ramp_k", type: "number", min: 0.1, max: 10, step: 0.1, unit: "K" },
        { name: "ff_neutral_c", type: "number", min: -30, max: 40, step: 0.5, unit: "°C" },
        { name: "ff_gain_pct_per_k", type: "number", min: 0, max: 10, step: 0.1, unit: "%/K" },
        { name: "ff_max_pct", type: "number", min: 0, max: 100, step: 1, unit: "%" },
        // v0.8.0 (B2): the global-only heat-pump water knobs.
        { name: "cooling_supply_base_c", type: "number", min: 10, max: 25, step: 0.5, unit: "°C" },
        { name: "heating_supply_base_c", type: "number", min: 20, max: 40, step: 0.5, unit: "°C" },
        { name: "heating_supply_slope", type: "number", min: 0, max: 2, step: 0.1, unit: "K/K" },
        { name: "outdoor_ff_enabled", type: "bool", unit: "" },
      ];
      // Library defaults as of v0.6.x (kp=14 / ki=0.0015 / kt=12 — the C1
      // retune; ki deliberately NOT a multiple of its 0.001 step, so the
      // preview exercises the honest stepper formatting, D6).
      const TUNE_DEFAULTS = {
        kp: 14.0, ki: 0.0015, kt: 12.0, deadband_c: 0.3, valve_floor_pct: 15.0,
        boost_offset_c: 1.0, fast_min_on_minutes: 10.0, fast_min_off_minutes: 10.0,
        fast_target_offset_k: 1.0,
        dew_margin_k: 2.0, dew_ramp_k: 2.0, ff_neutral_c: 15.0,
        ff_gain_pct_per_k: 1.0, ff_max_pct: 20.0, outdoor_ff_enabled: false,
        cooling_supply_base_c: 18.0, heating_supply_base_c: 26.0,
        heating_supply_slope: 0.5,
      };
      function sampleTuning() {
        return {
          fields: TUNE_FIELDS,
          global: { ...TUNE_DEFAULTS },
          rooms: JSON.parse(JSON.stringify(state.tuningRooms)),
          defaults: { ...TUNE_DEFAULTS },
        };
      }

      function makeHass() {
        syncExtraStates(state.scenario);
        return {
          language: state.lang,
          locale: { language: state.lang },
          states: STATES,
          themes: { darkMode: state.theme === "dark" },
          callWS(msg) {
            logEl.textContent = "callWS: " + msg.type;
            if (msg.type === "tortoise_ufh/get_config") {
              return Promise.resolve(sampleConfig(state.scenario));
            }
            if (msg.type === "tortoise_ufh/get_live") {
              // Keep the generated rooms' entity states in step with the
              // payload (a scenario / room-state change can come via the panel).
              syncExtraStates(state.scenario);
              return Promise.resolve(sampleLive(state.scenario, state.ageSeconds));
            }
            if (msg.type === "history/history_during_period") {
              const startMs = Date.parse(msg.start_time);
              const endMs = msg.end_time ? Date.parse(msg.end_time) : Date.now();
              return Promise.resolve(mockHistory(msg.entity_ids, startMs, endMs));
            }
            if (msg.type === "recorder/statistics_during_period") {
              const startMs = Date.parse(msg.start_time);
              const endMs = msg.end_time ? Date.parse(msg.end_time) : Date.now();
              return Promise.resolve(
                mockStatistics(msg.statistic_ids, startMs, endMs, msg.period),
              );
            }
            // Writes: echo a tiny result and mutate local mock state so the
            // optimistic UI reconciles on the panel's follow-up poll.
            if (msg.type === "tortoise_ufh/set_home_temperature") {
              state.homeSetpoint = msg.temperature;
              return Promise.resolve({ home_setpoint_c: msg.temperature });
            }
            if (msg.type === "tortoise_ufh/set_room_offset") {
              return Promise.resolve({ room: msg.room, offset_c: msg.offset });
            }
            if (msg.type === "tortoise_ufh/set_room_state") {
              state.roomStates[msg.room] = msg.state;
              return Promise.resolve({ room: msg.room, state: msg.state });
            }
            if (msg.type === "tortoise_ufh/set_mode") {
              state.scenario = msg.mode === "cooling" ? "cooling" : "heating";
              return Promise.resolve({ mode: msg.mode });
            }
            if (msg.type === "tortoise_ufh/set_hp_dhw") {
              state.hpDhw = !!msg.dhw;
              return Promise.resolve({
                dhw: state.hpDhw,
                option: state.hpDhw ? "Heat+DHW" : "Heat only",
              });
            }
            if (msg.type === "tortoise_ufh/get_tuning") {
              return Promise.resolve(sampleTuning());
            }
            if (msg.type === "tortoise_ufh/set_tuning") {
              if (msg.scope !== "global") {
                const ovr = { ...(state.tuningRooms[msg.scope] || {}) };
                for (const [k, v] of Object.entries(msg.values || {})) {
                  if (v === null) {
                    delete ovr[k];
                  } else {
                    ovr[k] = v;
                  }
                }
                if (Object.keys(ovr).length) {
                  state.tuningRooms[msg.scope] = ovr;
                } else {
                  delete state.tuningRooms[msg.scope];
                }
              }
              return Promise.resolve({ scope: msg.scope, ...sampleTuning() });
            }
            return Promise.reject(new Error("unknown command: " + msg.type));
          },
        };
      }

      let panel = document.getElementById("panel");
      function push() {
        panel.hass = makeHass();
      }
      // The panel fetches get_config only when it opens (re-pushing `hass`
      // never reloads it), so a room-count switch mounts a fresh panel element:
      // it loads the new room list exactly like opening the panel would. The
      // active tab survives (the panel keeps it in localStorage).
      function remountPanel() {
        const fresh = document.createElement("tortoise-ufh-panel");
        fresh.id = "panel";
        panel.replaceWith(fresh);
        panel = fresh;
        push();
      }
      // The panel module is imported as a deferred <script type="module"> that
      // runs after this classic script, so wait for the definition before the
      // first assignment (the panel also self-recovers via _upgradeProperty).
      if (customElements.get("tortoise-ufh-panel")) {
        push();
      } else {
        customElements.whenDefined("tortoise-ufh-panel").then(push);
      }

      // --- Toolbar wiring ---------------------------------------------------
      function activate(attr, value) {
        document.querySelectorAll("[" + attr + "]").forEach((b) => {
          b.classList.toggle("active", b.getAttribute(attr) === value);
        });
      }
      document.querySelectorAll("[data-theme-btn]").forEach((b) =>
        b.addEventListener("click", () => {
          state.theme = b.getAttribute("data-theme-btn");
          document.documentElement.setAttribute("data-theme", state.theme);
          activate("data-theme-btn", state.theme);
          push();
        }),
      );
      document.querySelectorAll("[data-lang-btn]").forEach((b) =>
        b.addEventListener("click", () => {
          state.lang = b.getAttribute("data-lang-btn");
          activate("data-lang-btn", state.lang);
          push();
        }),
      );
      document.querySelectorAll("[data-scenario-btn]").forEach((b) =>
        b.addEventListener("click", () => {
          state.scenario = b.getAttribute("data-scenario-btn");
          state.ageSeconds = state.scenario === "stale" ? 900 : 45;
          activate("data-scenario-btn", state.scenario);
          push();
        }),
      );
      document.querySelectorAll("[data-rooms-btn]").forEach((b) =>
        b.addEventListener("click", () => {
          state.roomCount = Number(b.getAttribute("data-rooms-btn"));
          activate("data-rooms-btn", String(state.roomCount));
          remountPanel();
        }),
      );
      document.getElementById("poll-btn").addEventListener("click", () => {
        state.ageSeconds += 70;
        push();
      });

      // Surface hass-more-info + location-changed events the panel dispatches.
      window.addEventListener("hass-more-info", (e) => {
        logEl.textContent = "hass-more-info: " + (e.detail && e.detail.entityId);
      });
      window.addEventListener("location-changed", () => {
        logEl.textContent = "location-changed: " + window.location.pathname;
      });
    </script>

    <script type="module">
      // Import the real panel module relatively (no bundling, no CDN).
      import "../custom_components/tortoise_ufh/frontend/tortoise-ufh-panel.js";
    </script>
  </body>
</html>
