# Automated Home Assistant integration tests for Tortoise-UFH, in a container.
#
#   docker compose -f docker/docker-compose.test.yml build
#   docker compose -f docker/docker-compose.test.yml run --rm ha-tests
#
# The repo is bind-mounted read-write at /workspace, so edits to
# custom_components/ or tests/ are picked up on the next run without rebuilding.
services:
  ha-tests:
    build:
      context: ..
      dockerfile: docker/Dockerfile.test
    image: tortoise-ufh-ha-tests
    volumes:
      - ..:/workspace:rw
    working_dir: /workspace
    environment:
      PYTHONPATH: /workspace
    command:
      - python
      - -m
      - pytest
      - tests/ha
      - -m
      - ha
      - -p
      - no:cacheprovider
      - -o
      - filterwarnings=default
      - -o
      - asyncio_mode=auto
      - -q

  # Mutation testing of the pure core (mutmut needs fork, so on Windows it runs
  # only in a container). mutmut's working copy lives on the named volume
  # `mutants` (a Windows bind mount slows it down); survivor diffs land in
  # the git-ignored mutation-survivors/ directory of the repo.
  #
  #   docker compose -f docker/docker-compose.test.yml build mutation
  #   docker compose -f docker/docker-compose.test.yml run --rm mutation
  #   docker compose -f docker/docker-compose.test.yml run --rm mutation \
  #     python scripts/mutation.py --survivors-dir mutation-survivors
  mutation:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mutation
    image: tortoise-ufh-mutation
    volumes:
      - ..:/workspace:rw
      - mutants:/workspace/mutants
    working_dir: /workspace
    environment:
      PYTHONPATH: /workspace
    command: ["python", "scripts/mutation.py"]

volumes:
  mutants:
